[build-system]
requires = [
    "setuptools==84.0.0",
    "setuptools_scm==10.3.4",
]
build-backend = "setuptools.build_meta"

[project]
dynamic = ["version"]
name = "editor"

[tool.briefcase]
project_name = "Editor"
bundle = "org.beeware.examples"
url = "https://beeware.org"
license = "BSD-3-Clause"
license-files = ["../../LICENSE"]
author = "Kattni"
author_email = "hello@kattni.com"
description = "A code editor demonstrating the toga-code-editor widget."
# macOS and iOS install the widget from this repository; Android installs it from a
# built wheel (run `uv build --wheel` from the repository root first), because Gradle
# rejects a path requirement whose directory contains the Android build tree. The
# wheel filename below carries the package version, so a version bump must update it.
requires = []

[tool.briefcase.app.editor]
formal_name = "Editor"
sources = ["src/editor"]

[tool.briefcase.app.editor.macOS]
requires = [
    "../..",
    "toga-cocoa ~= 0.5.7",
    "std-nslog >= 1.0.0",
]

[tool.briefcase.app.editor.iOS]
requires = [
    "../..",
    "toga-iOS ~= 0.5.7",
    "std-nslog >= 1.0.0",
]

[tool.briefcase.app.editor.android]
requires = [
    "../../dist/toga_code_editor-0.1.0.dev0-py3-none-any.whl",
    "toga-android ~= 0.5.7",
]
base_theme = "Theme.MaterialComponents.Light.DarkActionBar"
build_gradle_dependencies = [
    "com.google.android.material:material:1.12.0",
]
# Chaquopy serves Python modules from its asset archive and only extracts data files
# to the filesystem, so a directory listing of resources/samples would never see
# hello.py. Keep the app's sources uncompiled and extract the whole package to disk.
build_gradle_extra_content = """
android {
    defaultConfig {
        python {
            pyc {
                src false
            }
            extractPackages("editor")
        }
    }
}
"""

[tool.setuptools_scm]
root = "../../"
